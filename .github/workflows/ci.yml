name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundry:
    name: Foundry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          required=(
            README.md
            foundry.toml
            contracts/FlowMemoryAfterSwapHook.sol
            contracts/FlowMemoryHookPlanner.sol
            contracts/FlowPulse.sol
            contracts/interfaces/IFlowMemoryHookAdapter.sol
            contracts/interfaces/IUniswapV4SwapHookLike.sol
            test/FlowMemoryAfterSwapHook.t.sol
            docs/ARCHITECTURE.md
            docs/HOW_IT_WORKS.md
            docs/UNISWAP_V4_COMPATIBILITY.md
            docs/WHY_IT_WORKS.md
            docs/EVENT_MODEL.md
            docs/READER_VERIFIER_ARCHITECTURE.md
            docs/INTEGRATION_BLUEPRINT.md
            docs/SECURITY_MODEL.md
            docs/ARCHITECTURE_DECISIONS.md
            docs/PUBLIC_RELEASE_PATH.md
            docs/PUBLIC_REVIEW_CHECKLIST.md
            docs/BASE_SEPOLIA_PLAN.md
            docs/BASE_SEPOLIA_RELEASE_RECORD_TEMPLATE.md
            docs/OFFICIAL_REFERENCES.md
            docs/EXPERT_REVIEW_PROMPT.md
          )

          missing=0
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Missing required file: $path"
              missing=1
            fi
          done

          exit "$missing"

      - name: Check for obvious committed secrets
        shell: bash
        run: |
          patterns=(
            'BEGIN (RSA|OPENSSH|PRIVATE) K[E]Y'
            'PRIVATE_K[E]Y='
            'SECRET_K[E]Y='
            'AWS_SECRET_ACCESS_K[E]Y'
            'gho_[A-Za-z0-9_]+'
            'https://hooks\.slack\.com/services/'
            'https://discord(app)?\.com/api/webhooks/'
          )

          for pattern in "${patterns[@]}"; do
            if grep -RInE "$pattern" . --exclude-dir=.git --exclude='ci.yml'; then
              echo "::error::Potential secret detected."
              exit 1
            fi
          done
