          missing=0
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Missing required file: $path"
              missing=1
            fi
          done

          exit "$missing"

      - name: Check for obvious committed secrets
        shell: bash
        run: |
          patterns=(
            'BEGIN (RSA|OPENSSH|PRIVATE) K[E]Y'
            'PRIVATE_K[E]Y='
            'SECRET_K[E]Y='
            'AWS_SECRET_ACCESS_K[E]Y'
            'gho_[A-Za-z0-9_]+'
            'https://hooks\.slack\.com/services/'
            'https://discord(app)?\.com/api/webhooks/'
          )

          for pattern in "${patterns[@]}"; do
            if grep -RInE "$pattern" . --exclude-dir=.git --exclude='ci.yml'; then
              echo "::error::Potential secret detected."
              exit 1
            fi
          done

      - name: Check reader CLI
        run: python tools/read_flowpulse_logs.py --help

      - name: Test reader decoder
        run: python -m unittest tools.test_read_flowpulse_logs

      - name: Test agent memory trace compiler
        run: python -m unittest tools.test_memory_trace

      - name: Check pulse trace example
        run: python tools/memory_trace.py verify-trace examples/pulse-trace/trace.example.json --output /tmp/agent-memory-pack.json

      - name: Test AxiomWrit
        run: python -m unittest tools.test_axiom_writ

      - name: Check AxiomWrit demo
        run: |
          python tools/axiom_writ.py verify --writ examples/axiom-writ/axiomwrit.example.json
          python tools/axiom_writ.py apply --writ examples/axiom-writ/axiomwrit.example.json --plan examples/axiom-writ/plan.allowed-citation.json --out /tmp/allowed.json
          python tools/axiom_writ.py apply --writ examples/axiom-writ/axiomwrit.example.json --plan examples/axiom-writ/plan.denied-action.json --out /tmp/denied.json && exit 1 || test "$?" = "2"

      - name: Test AxiomPatch
        run: python -m unittest tools.test_axiom_patch

      - name: Check AxiomPatch demo
        run: |
          python tools/axiom_patch.py verify --patch examples/axiom-patch/axiompatch.example.json
          python tools/axiom_patch.py apply --patch examples/axiom-patch/axiompatch.example.json --plan examples/axiom-patch/plan.mixed-actions.json --out /tmp/patch-verdict.json && exit 1 || test "$?" = "2"

      - name: Test BoundaryFission
        run: python -m unittest tools.test_boundary_fission

      - name: Check BoundaryFission demo
        run: |
          python tools/boundary_fission.py demo
          python tools/boundary_fission.py verify --report examples/boundary-fission/fission-report.example.json
          python tools/boundary_fission.py apply --flowpulse examples/boundary-fission/flowpulse-evidence.fixture.json --memory examples/boundary-fission/agent-working-memory.before.json --policy examples/boundary-fission/fission-policy.fixture.json --report /tmp/fission-report.json --after /tmp/memory-after.json

      - name: Test PulseRetire
        run: python -m unittest tools.test_pulse_retire

      - name: Check PulseRetire demo
        run: |
          python tools/pulse_retire.py demo
          python tools/pulse_retire.py verify --retirement examples/pulse-retire/retirement.retired.example.json
          python tools/pulse_retire.py enforce --queue examples/pulse-retire/queue.after-retire.json --artifact-id model-output-001

      - name: Test FlowMMU
        run: python -m unittest tools.test_flow_mmu

      - name: Check FlowMMU demo
        run: |
          python tools/flow_mmu.py demo
          python tools/flow_mmu.py verify-page --page examples/flow-mmu/receipt-page.example.json

      - name: Test FlowQuiesce
        run: python -m unittest tools.test_flow_quiesce

      - name: Check FlowQuiesce demo
        run: python tools/flow_quiesce.py demo

      - name: Test FlowSerial
        run: python -m unittest tools.test_flow_serial

      - name: Check FlowSerial demo
        run: |
          python tools/flow_serial.py demo
          python tools/flow_serial.py verify-certificate --certificate examples/flow-serial/certificate.valid.json

      - name: Test FlowLitmus
        run: python -m unittest tools.test_flow_litmus

      - name: Check FlowLitmus suite
        run: python tools/flow_litmus.py run --suite examples/flow-litmus/litmus.manifest.json

      - name: Test launch reality check
        run: python -m unittest tools.test_launch_reality_check

      - name: Check launch reality check
        run: python tools/launch_reality_check.py --pretty

      - name: Test FMM-0 manifest
        run: python -m unittest tools.test_fmm0_manifest

      - name: Check FMM-0 matrix
        run: python tools/render_fmm0_matrix.py --check

      - name: Test memory consistency card
        run: python -m unittest tools.test_memory_consistency_card

      - name: Check memory consistency card
        run: python tools/memory_consistency_card.py --pretty

      - name: Test reviewer walkthrough
        run: python -m unittest tools.test_reviewer_walkthrough

      - name: Check reviewer walkthrough
        run: python tools/reviewer_walkthrough.py --pretty
